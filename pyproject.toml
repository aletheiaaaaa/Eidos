[project]
name = "lumina"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aletheiaaaaa", email = "carbon674@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "diffusers>=0.39.0",
    "einops>=0.8.2",
    "h5py>=3.16.0",
    "pyyaml>=6.0.3",
    "torch>=2.13.0",
    "torchao>=0.18.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
    "transformers>=5.14.1",
    "wandb>=0.28.1",
]

[project.scripts]
lumina = "lumina.cli:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
