data:
  dataset: Fhrozen/relaion-art
  split: train
  resolution: 512
  stream_batch_size: 16384
  encode_batch_size: 64
  save_dir: ./data
  samples_per_shard: 10000
  vae: stabilityai/sd-vae-ft-mse
  clip: openai/clip-vit-large-patch14

train:
  p_mean: -0.4
  p_std: 1.0
  p_ratio: 0.25
  p_uncond: 0.1
  n_warmup: 5
  n_epochs: 200
  batch_size: 128
  num_workers: 0
  seed: 0
  lr: 1.0e-4
  weight_decay: 1.0e-2
  max_grad_norm: 1.0
  ema_decay: 0.9999
  mixed_precision: bf16
  log_interval: 50
  wandb_project: ""
  save_interval: 50
  sample_interval: 0
  sample_prompts: []
  sample_steps: 2
  sample_guidance: 3.0
  output_dir: ./checkpoints

diffuser:
  img_size: 64
  patch_size: 2
  d_caption: 768
  n_channels: 4
  vae: stabilityai/sd-vae-ft-mse
  clip: openai/clip-vit-large-patch14
  model_path: ""

  dit:
    d_model: 512
    n_heads: 8
    d_head: 64
    d_mlp: 2048
    n_layers: 6
