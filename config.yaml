data:
  dataset: ILSVRC/imagenet-1k
  split: train
  resolution: 256
  image_key: image
  label_key: label
  prompt_template: "a photo of a {}"
  shuffle_buffer: 10000
  max_tokens: 77
  encoder: facebook/dinov3-vitb16-pretrain-lvd1689m
  n_stat_batches: 50
  clip: openai/clip-vit-large-patch14

train:
  p_mean: -0.4
  p_std: 1.0
  p_ratio: 0.25
  p_uncond: 0.1
  n_warmup: 1000
  max_steps: 200000
  batch_size: 128
  num_workers: 8
  seed: 0
  lr: 1.0e-4
  weight_decay: 1.0e-2
  max_grad_norm: 1.0
  ema_decay: 0.9999
  mixed_precision: bf16
  compile: true
  log_interval: 50
  wandb_project: "lumina"
  save_interval: 5000
  sample_interval: 2500
  sample_prompts:
    - "a photo of a golden retriever"
    - "a photo of a monarch butterfly"
    - "a photo of a espresso maker"
    - "a photo of a volcano"
  sample_steps: 2
  sample_guidance: 3.0
  output_dir: ./checkpoints

diffuser:
  img_size: 16
  patch_size: 1
  d_caption: 768
  n_channels: 768
  clip: openai/clip-vit-large-patch14
  decoder_path: ""

  dit:
    d_model: 768
    n_heads: 12
    d_head: 64
    d_mlp: 3072
    n_layers: 12
