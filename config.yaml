data:
  dataset: Fhrozen/relaion-art
  split: train
  resolution: 512
  stream_batch_size: 16384
  save_dir: ./data
  samples_per_shard: 10000
  vae: stabilityai/sd-vae-ft-mse
  clip: openai/clip-vit-large-patch14

train:
  p_mean: -0.4
  p_std: 1.0
  p_ratio: 0.25
  n_warmup: 5
  n_epochs: 200
  batch_size: 128
  num_workers: 0
  lr: 1.0e-4
  weight_decay: 1.0e-2
  mixed_precision: bf16
  save_interval: 50
  output_dir: ./checkpoints

diffuser:
  img_size: 64
  patch_size: 2
  d_caption: 768
  n_channels: 4
  vae: stabilityai/sd-vae-ft-mse
  clip: openai/clip-vit-large-patch14
  model_path: ""

  dit:
    d_model: 512
    n_heads: 8
    d_head: 64
    d_mlp: 2048
    n_layers: 6
